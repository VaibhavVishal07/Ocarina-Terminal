name: Download counts

# GitHub keeps a running total of release downloads and no history at all.
# This writes the total down once a day, on a branch of its own, so the
# shape over time exists later even though it cannot be backfilled.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the metrics branch
        run: |
          git clone --depth 1 --branch metrics \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics 2>/dev/null \
          || { mkdir metrics && cd metrics && git init -q \
               && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
               && git checkout -q --orphan metrics \
               && printf 'date,tag,asset,downloads\n' > downloads.csv; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append today's counts
        working-directory: metrics
        run: |
          [ -f downloads.csv ] || printf 'date,tag,asset,downloads\n' > downloads.csv
          today=$(date -u +%F)
          grep -q "^${today}," downloads.csv && { echo "already recorded for ${today}"; exit 0; }
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | .tag_name as \$t | .assets[] | \"${today},\(\$t),\(.name),\(.download_count)\"" \
            >> downloads.csv
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        working-directory: metrics
        run: |
          git diff --quiet -- downloads.csv 2>/dev/null && [ -n "$(git log -1 2>/dev/null)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.csv
          git diff --cached --quiet || git commit -q -m "Downloads as of $(date -u +%F)"
          git push -q origin metrics
